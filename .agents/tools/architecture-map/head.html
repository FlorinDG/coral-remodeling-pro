<head>
<meta charset="utf-8">
<title>CoralOS — Architecture Map</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f7f7f5;color:#1a1a1a;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:36px 28px 90px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:#6b6b66;font-size:14px;margin-bottom:22px}
h2{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8a8a82;margin:42px 0 14px;padding-bottom:8px;border-bottom:1px solid #e3e3dd}
.totals{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.tot{background:#fff;border:1px solid #e3e3dd;border-radius:9px;padding:12px 16px;min-width:118px}
.tot .n{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tot .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8a8a82;margin-top:3px}
.layer{background:#fff;border:1px solid #e3e3dd;border-radius:10px;margin:0 0 10px;overflow:hidden}
.layer.gate{border-left:4px solid #c2410c}
.layer.mgate{border-left:4px solid #8a5a00}
.lhead{display:flex;align-items:baseline;gap:12px;padding:13px 18px;background:#fafaf8;border-bottom:1px solid #eeeee8;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#1a1a1a;color:#fff;border-radius:4px;padding:3px 8px}
.tag.g{background:#c2410c}.tag.mg{background:#8a5a00}.tag.x{background:#77776f}
.lname{font-size:16px;font-weight:700}
.lwhat{color:#6b6b66;font-size:13px}
.lnums{margin-left:auto;font-size:12.5px;color:#6b6b66;white-space:nowrap}
.lnums b{color:#1a1a1a}
.lnums .p0{color:#c2410c;font-weight:800}
.blocks{padding:6px 18px 14px}
.blk{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #f4f4ee;font-size:13.5px}
.blk:last-child{border-bottom:none}
.bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{width:120px;height:6px;border-radius:3px;background:#eeeee8;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:#1a7f47}
.bar i.warn{background:#c2410c}
.cnt{width:96px;text-align:right;color:#8a8a82;font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.cnt b{color:#1a1a1a}
.cnt .p{color:#c2410c;font-weight:800}
.flow{background:#fff;border:1px solid #e3e3dd;border-radius:10px;padding:18px}
.track{margin:0 0 16px}
.track:last-child{margin-bottom:0}
.tname{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a8a82;margin-bottom:8px}
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{background:#f4f4ee;border:1px solid #e3e3dd;border-radius:6px;padding:5px 11px;font-size:13px;font-weight:600}
.step.now{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.step.blocked{background:#fff;color:#a0a099;border-style:dashed}
.step.you{background:#fff3e0;border-color:#f0d9ae;color:#8a5a00}
.arr{color:#c4c4bc;font-weight:700}
.callout{background:#fff;border:1px solid #e3e3dd;border-left:3px solid #c2410c;border-radius:6px;padding:15px 18px;margin:14px 0}
.callout h4{margin:0 0 7px;font-size:14px;font-weight:800}
.callout p{margin:0 0 7px}.callout p:last-child{margin:0}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e3dd;border-radius:9px;overflow:hidden;font-size:13.5px;margin-top:10px}
th{background:#fafaf8;text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#77776f;padding:9px 13px;border-bottom:1px solid #e3e3dd}
td{padding:8px 13px;border-bottom:1px solid #f4f4ee;vertical-align:top}
tr:last-child td{border-bottom:none}
.ok{color:#1a7f47;font-weight:700}
code{background:#f0f0ea;border-radius:4px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.foot{margin-top:46px;padding-top:16px;border-top:1px solid #e3e3dd;color:#8a8a82;font-size:12.5px}
.step.done{background:#e8f5ec;border-color:#bfe3cb;color:#1a7f47}
.since{background:#fff;border:1px solid #e3e3dd;border-left:3px solid #1a7f47;border-radius:6px;padding:15px 18px;margin:14px 0}
.since h4{margin:0 0 7px;font-size:14px;font-weight:800}.since p{margin:0 0 7px}.since ul{margin:4px 0 0 18px;padding:0}
details.blkd>summary{list-style:none;cursor:pointer}
details.blkd>summary::-webkit-details-marker{display:none}
details.blkd>summary .bn::before{content:"▸ ";color:#9a948c}
details.blkd[open]>summary .bn::before{content:"▾ "}
.tasks{margin:2px 0 10px 14px;border-left:2px solid #e3e3dd;padding-left:10px}
.tr{display:grid;grid-template-columns:150px 28px 1fr 110px;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed #eeece6;align-items:baseline}
.tr .tid{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;overflow-wrap:anywhere}
.tr .tpr{font-size:10.5px;color:#6b625a}.tr.p0 .tpr{color:#c2410c;font-weight:700}
.tr .tst{font-size:11px;color:#6b625a;text-align:right}
.tr.closed{opacity:.5}
.expand{font-size:12px;color:#6b625a;margin:0 0 10px}
@media (max-width:640px){.tr{grid-template-columns:1fr auto;}.tr .ttx{grid-column:1/-1}.tr .tpr{display:none}}
.search{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:#f7f7f5;padding:10px 0;margin:6px 0 4px}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 14px;border:1.5px solid #d6d3cc;border-radius:10px;background:#fff;color:#1a1714;outline:none}
.search input:focus{border-color:#c2410c;box-shadow:0 0 0 3px rgba(194,65,12,.12)}
.qcount{font-size:12px;color:#6b625a;white-space:nowrap}
.results{background:#fff;border:1px solid #e3e3dd;border-radius:10px;margin:0 0 18px;max-height:62vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.res{padding:11px 14px;border-bottom:1px solid #f0eee9}
.res.sel{background:#fff7ed}
.res.closed{opacity:.62}
.rh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:4px}
.rid{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px}
.rpr{font-size:11px;color:#6b625a}.res.p0 .rpr{color:#c2410c;font-weight:700}
.rst{font-size:11px;padding:1px 7px;border-radius:99px;background:#f1efe9;color:#4a443d}
.rwh{font-size:11px;color:#8a8278}
.rgo{margin-left:auto;font:inherit;font-size:11px;border:1px solid #e3e3dd;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;color:#4a443d}
.rgo:hover{border-color:#c2410c;color:#c2410c}
.rtx{font-size:13px;line-height:1.45}
.rno{font-size:12px;line-height:1.45;color:#5b544c;margin-top:5px;padding-left:9px;border-left:2px solid #eeece6}
.rsrc{font-size:11px;color:#8a8278;margin-top:4px}
.results mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
.tr .tid{cursor:pointer}.tr .tid:hover{color:#c2410c;text-decoration:underline}
.tr.hit{background:#fff7ed;outline:2px solid #fdba74;border-radius:4px}
</style>
</head>
